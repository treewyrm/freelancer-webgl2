; Sits beside the game executable, next to d3d8.dll. Absent, these defaults apply.
[log]

; Where the capture goes, relative to the game directory. Rewritten each run.
file = d3d8log.jsonl

; Virtual-key code that arms a capture. 0x78 is F9.
key = 0x78

; Frames captured per press. More than one because the once-at-birth question in EXP-02 is a
; question about consecutive frames.
frames = 3

; Vertex data is dumped only for draws at or under this many vertices, so one press over a busy
; scene stays a file rather than a directory. A one-particle test asset draws four.
verts_max = 64

; Include world/view/projection with every draw. Off makes the log a third the size and gives up
; the check that the captured quad sits where the hardpoint says it does.
matrices = 1

; Log every draw, not only those carrying a vertex dump. On for the first capture — the point of
; the first capture is to find out what Freelancer actually does.
all_draws = 1
